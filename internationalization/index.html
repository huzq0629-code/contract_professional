"en":"Inheritance / Override","summary":"用户未设置时沿用法人默认，法人未设则回退平台；主动覆盖需单独记录。","why":"管理默认值同时保留个性化。","confusion":"业务基准时区和法人本位币不属于可随意个性化的显示设置。","sources":[{"source":"S01","start":453,"end":497},{"source":"S01","start":524,"end":528}],"related":["locale","calendar","functional"]},{"id":"template","type":"术语","module":"G1","title":"模板与条款语言版本","en":"Template / Clause version","summary":"经审核的合同模板和条款各自的语言及内容版本。","why":"确保送签文本和批准文本一致。","confusion":"切界面语言不能自动改合同正文。","sources":[{"source":"S11","start":42,"end":50},{"source":"S01","start":449,"end":451}],"related":["i18n","hash"]},{"id":"currency","type":"术语","module":"G2","title":"币种","en":"Currency","summary":"金额的计量单位，如 EUR、PLN、CNY。","why":"任何金额都要知道“是什么钱”。","confusion":"币种、金额数值和地区写法是三件事。","sources":[{"source":"S12","start":9,"end":17}],"related":["iso4217","locale","fx"]},{"id":"iso4217","type":"术语","module":"G2","title":"ISO 币种代码","en":"ISO 4217","summary":"识别货币的标准代码体系，主数据也需维护对应货币的小数位。","why":"便于接口、合同和财务使用统一单位。","confusion":"EUR 是代码，€ 是符号；不能假设所有币种均保留两位小数。","sources":[{"source":"S01","start":573,"end":605},{"source":"S12","start":44,"end":48}],"related":["currency","precision"]},{"id":"transaction","type":"术语","module":"G2","title":"交易币种","en":"Transaction Currency","summary":"一份合同或订单约定的原始计价货币。","why":"决定合同金额和对外文本的单位。","confusion":"不随查看者地区或集团看板币种改变。","sources":[{"source":"S01","start":586,"end":607},{"source":"S12","start":109,"end":115}],"related":["functional","reporting","currency"]},{"id":"functional","type":"术语","module":"G2","title":"法人本位币","en":"Local / Functional Currency","summary":"在本知识库中指各法人采用的记账基准货币，需与客户财务口径对齐。","why":"多法人可在一套系统中使用不同基准。","confusion":"原材料将“记账币种”统一为“法人本位币”；财务系统中的功能货币、列报货币等精确定义仍由财务确认。","sources":[{"source":"S09","start":37,"end":43},{"source":"S01","start":586,"end":607}],"related":["transaction","reporting","erp"]},{"id":"reporting","type":"术语","module":"G2","title":"报告币种","en":"Report / Group Currency","summary":"租户或集团汇总展示所选的统一货币。","why":"使多币种合同可在同一单位下比较。","confusion":"不是每份合同原币，也不能直接代替法人的会计记账口径。","sources":[{"source":"S12","start":85,"end":130},{"source":"S12","start":160,"end":172}],"related":["transaction","functional","fx"]},{"id":"fx","type":"术语","module":"G2","title":"汇率","en":"Exchange Rate","summary":"从明确的源币种到目标币种的换算比率。","why":"折算需要币种对、取值日期、来源与规则。","confusion":"1 EUR=4.30 PLN 与 1 PLN=0.2326 EUR 方向不同，不能只存一个无单位数。","sources":[{"source":"S12","start":32,"end":41},{"source":"S01","start":609,"end":619}],"related":["quotation","fxdate","fxkind","fxlock"]},{"id":"fxdate","type":"术语","module":"G2","title":"汇率取值时点","en":"Rate date / Effective date","summary":"按哪个业务日期选择适用汇率的规则。","why":"签约、预算、报表可能需要不同取值基准。","confusion":"今天的市场汇率不能自动覆盖历史合同约定汇率。","sources":[{"source":"S12","start":32,"end":41},{"source":"S01","start":647,"end":647}],"related":["fx","fxlock"]},{"id":"fxkind","type":"术语","module":"G2","title":"汇率类型","en":"Exchange Rate Type","summary":"按日常业务、预算、期末或合同约定区分用途的汇率分类。","why":"防止一个数字被不同业务目的误用。","confusion":"来自 ERP 对标；不等于后续简化首期已确定建设全部类型。","sources":[{"source":"S02","start":25,"end":42},{"source":"S02","start":198,"end":223}],"related":["fx","erp","fxdate"]},{"id":"quotation","type":"术语","module":"G2","title":"标价方向与换算比例","en":"Quotation / Translation Ratio","summary":"说明多少源币对应多少目标币，并明确按乘法还是除法换算。","why":"避免方向和 1:100 比例误读。","confusion":"换算比例、实际汇率与金额精度不是同一参数。","sources":[{"source":"S02","start":44,"end":59},{"source":"S02","start":171,"end":179}],"related":["fx","precision","rounding"]},{"id":"fxlock","type":"术语","module":"G2","title":"汇率快照与锁定","en":"Rate snapshot / Lock","summary":"把单据实际采用的汇率和折算上下文固化下来。","why":"后续更新汇率表时，历史合同仍可复算。","confusion":"锁定单据汇率不妨碍另做当前估值报表，但必须分开标明口径。","sources":[{"source":"S01","start":609,"end":619},{"source":"S12","start":184,"end":191}],"related":["fx","rounding","audit"]},{"id":"tolerance","type":"术语","module":"G2","title":"汇率偏离与容差","en":"Rate tolerance","summary":"填报汇率相对基准的可接受偏离范围。","why":"超区间时提示、要求说明或触发复核。","confusion":"早期素材提拦截；后续说明建议提示不硬拦，强度需确认。","sources":[{"source":"S02","start":137,"end":168},{"source":"S01","start":609,"end":647}],"related":["fx","fxlock"]},{"id":"precision","type":"术语","module":"G2","title":"金额精度与汇率精度","en":"Precision","summary":"金额的小数位、内部保存精度和汇率比率精度分别管理。","why":"避免舍入尾差和不可复算。","confusion":"汇率不能直接沿用金额的两位小数；计算不用普通二进制浮点草率处理。","sources":[{"source":"S12","start":44,"end":48},{"source":"S12","start":143,"end":146},{"source":"S02","start":137,"end":140}],"related":["currency","rounding","fx"]},{"id":"rounding","type":"术语","module":"G2","title":"舍入与折算尾差","en":"Rounding","summary":"按明细先折算再汇总，与先汇总再折算可能产生的差异及处理规则。","why":"使金额与接口对账有一致依据。","confusion":"显示两位小数不等于内部只保留两位；尾差不能污染原币约定金额。","sources":[{"source":"S12","start":38,"end":41},{"source":"S02","start":198,"end":223}],"related":["precision","fxlock","erp"]},{"id":"erp","type":"术语","module":"G2","title":"企业资源计划系统","en":"ERP","summary":"承载采购、财务、记账和相关经营数据的业务系统。","why":"提供币种与财务口径，处理汇兑损益等账务结果。","confusion":"ERP 功能对标是设计借鉴，不是 MeFlow 已有能力证明。","sources":[{"source":"S02","start":198,"end":234},{"source":"S01","start":621,"end":634}],"related":["mdm","functional","fxkind"]},{"id":"utc","type":"术语","module":"G3","title":"协调世界时","en":"UTC","summary":"跨时区比较具体时刻的共同时间基准。","why":"保存事件发生时刻、关联日志和签署证据。","confusion":"纯日期不能机械转成 UTC 零点后换算；UTC 也不自带某地节假日。","sources":[{"source":"S03","start":76,"end":93},{"source":"S01","start":436,"end":451}],"related":["instant","dateonly","iana"]},{"id":"instant","type":"术语","module":"G3","title":"具体时刻","en":"Instant / User Local","summary":"全球时间轴上的某一点，用户可看到不同本地时间。","why":"适用于创建、操作、回调等发生时刻。","confusion":"同一时刻的当地日期可能不同，不应当作合同纯日期。","sources":[{"source":"S03","start":76,"end":89},{"source":"S01","start":499,"end":507}],"related":["utc","dateonly","independent"]},{"id":"dateonly","type":"术语","module":"G3","title":"纯日期","en":"Date Only","summary":"只有年、月、日的业务值，没有一天中的时间。","why":"用于按业务定义的生效日、到期日等日期字段。","confusion":"不是“UTC 零点只显示日期”，该做法可能跨区偏一天。","sources":[{"source":"S03","start":28,"end":37},{"source":"S03","start":76,"end":89}],"related":["instant","independent","utc"]},{"id":"independent","type":"术语","module":"G3","title":"时区无关时间","en":"Time-Zone Independent","summary":"所有用户看到相同的日期时间字面值，按业务定义不做时区换算。","why":"适用于只需固定本地钟面值的场景。","confusion":"区别于全球同一时刻，也区别于完全不含时间的纯日期。","sources":[{"source":"S03","start":76,"end":89}],"related":["instant","dateonly"]},{"id":"iana","type":"术语","module":"G3","title":"城市时区数据库","en":"IANA tzdata","summary":"记录各地区历史偏移及夏令时等变化的标准时区数据。","why":"使用 Europe/Berlin 一类标识，避免固定偏移错误。","confusion":"时区名不是 GMT+1 常量；规则库升级后仍要验证调度行为。","sources":[{"source":"S03","start":91,"end":93},{"source":"S01","start":538,"end":551}],"related":["utc","dst","cldr"]},{"id":"dst","type":"术语","module":"G3","title":"夏令时","en":"Daylight Saving Time / DST","summary":"某些地区按季节调整当地钟表的规则。","why":"会影响本地时刻转换、重复小时、跳过小时与任务调度。","confusion":"不能据此假设每个欧洲地点都同样调时。","sources":[{"source":"S01","start":530,"end":542}],"related":["iana","calendar","instant"]},{"id":"cldr","type":"术语","module":"G3","title":"通用语言环境数据","en":"Unicode CLDR","summary":"提供日期、数字、货币、语言名称和排序等本地化数据。","why":"把显示规则交给标准数据与格式化工具。","confusion":"CLDR 管写法，IANA tzdata 管时区历史与偏移。","sources":[{"source":"S01","start":544,"end":551}],"related":["locale","iana","unicode"]},{"id":"calendar","type":"术语","module":"G3","title":"法人工作日历","en":"Business Calendar","summary":"某个法人或业务地点的工作日、节假日和工作时段。","why":"使“两个工作日内审批”有可计算依据。","confusion":"日历不能仅靠时区推断；谁维护节假日需确认。","sources":[{"source":"S03","start":163,"end":189},{"source":"S01","start":465,"end":474}],"related":["sla","iana","inherit"]},{"id":"e164","type":"术语","module":"G3","title":"国际电话号码规则","en":"E.164","summary":"国际公共电信编号规则，规范国际电话号码；编号最长 15 位数字。","why":"放开中国手机号假设，并支持国际号码解析与显示。","confusion":"规范化表示与国家码字段拆分可组合使用，不能把格式合法等同于号码真实可达。","sources":[{"source":"S03","start":64,"end":72},{"source":"S03","start":116,"end":122}],"related":["address","displayname"]},{"id":"displayname","type":"术语","module":"G3","title":"自由展示名与排序键","en":"Display Name / Sort Key","summary":"显示给用户的完整姓名，与用于排序和匹配的信息分别管理。","why":"支持单名、复姓、多文字和不同姓名顺序。","confusion":"不能强制世界所有姓名都拆成一个姓和一个名。","sources":[{"source":"S03","start":39,"end":50},{"source":"S03","start":95,"end":102}],"related":["unicode","address"]},{"id":"address","type":"术语","module":"G3","title":"国家驱动的弹性地址","en":"Country-driven Address","summary":"根据国家调整字段可见性、必填和校验，同时支持多行地址。","why":"供相对方、对外合同和通知使用。","confusion":"不是把中国省市区翻成英文。","sources":[{"source":"S03","start":52,"end":62},{"source":"S03","start":104,"end":114}],"related":["e164","displayname","mdm"]},{"id":"unicode","type":"术语","module":"G3","title":"国际字符与字体","en":"Unicode / Font embedding","summary":"准确保存与渲染不同文字、重音字符和国际文件名的基础。","why":"保证导入、检索、PDF 与签署文件不丢字。","confusion":"编码支持并不自动代表 PDF 字体已覆盖。","sources":[{"source":"S03","start":153,"end":174}],"related":["rtl","displayname","template"]},{"id":"residency","type":"术语","module":"G4","title":"数据驻留","en":"Data Residency","summary":"数据存储与约定处理位置的区域要求，需明确覆盖范围。","why":"决定主库、副本、日志、第三方和支持访问的边界。","confusion":"驻留不是主权，也不自动构成全面 GDPR 合规。","sources":[{"source":"S06","start":11,"end":35},{"source":"S01","start":297,"end":325}],"related":["sovereignty","localization","scope"]},{"id":"sovereignty","type":"术语","module":"G4","title":"数据主权","en":"Data Sovereignty","summary":"数据受到哪些法律、运营主体和控制关系影响的问题。","why":"采购时会追问母公司、人员和控制平面归属。","confusion":"欧洲机房地址不足以证明不受域外法律影响。","sources":[{"source":"S06","start":11,"end":35},{"source":"S07","start":180,"end":188}],"related":["residency","localization","controlplane"]},{"id":"localization","type":"术语","module":"G4","title":"数据本地化要求","en":"Data Localization","summary":"法律或适用的强制规则要求数据在指定地域保存／处理。","why":"可能触发区域化架构和供应商约束。","confusion":"客户合同约定的驻留与法定强制本地化须区分义务来源。","sources":[{"source":"S06","start":11,"end":19},{"source":"S04","start":203,"end":210}],"related":["residency","gdpr"]},{"id":"gdpr","type":"术语","module":"G4","title":"通用数据保护条例","en":"GDPR","summary":"欧盟个人数据保护框架，规定处理原则、权利、责任及第三国传输条件。","why":"涉及联系人、员工、签署人、日志和处理链路。","confusion":"GDPR 不是“一律不得离开欧盟”的规则，也不是仅约束数据库所在地。","sources":[{"source":"S04","start":18,"end":38},{"source":"S01","start":327,"end":357}],"related":["eea","pii","transfer","controller"]},{"id":"eea","type":"术语","module":"G4","title":"欧洲经济区","en":"EEA","summary":"欧盟成员国加冰岛、列支敦士登、挪威；是本材料讨论第五章传输的主要区域边界。","why":"区分区内流动与向第三国提供数据。","confusion":"英国、瑞士不在 EEA；EMEA 也不等于 EEA。","sources":[{"source":"S04","start":30,"end":48},{"source":"S07","start":59,"end":66}],"related":["gdpr","adequacy","transfer"]},{"id":"transfer","type":"术语","module":"G4","title":"向第三国传输","en":"Chapter V transfer","summary":"向第三国的另一个控制者／处理者提供受 GDPR 约束的个人数据，需要判断适用的第五章条件。","why":"包括符合条件的远程访问，不能只盯文件物理搬迁。","confusion":"不是仅看访问者 IP；同一控制者员工出差访问与向境外另一实体披露须区分，见 C08。","sources":[{"source":"S04","start":18,"end":28},{"source":"S04","start":104,"end":116}],"related":["scc","tia","adequacy","controller"]},{"id":"adequacy","type":"术语","module":"G4","title":"充分性认定","en":"Adequacy Decision","summary":"欧盟对特定第三国、地区或领域保护水平作出的认定。","why":"可作为特定传输的依据，范围和有效状态需查证。","confusion":"不是“所有数据和方向永远免评估”的通行证；本次未逐一复核名单。","sources":[{"source":"S04","start":40,"end":48},{"source":"S04","start":163,"end":169}],"related":["transfer","scc","eea"]},{"id":"scc","type":"术语","module":"G4","title":"标准合同条款","en":"Standard Contractual Clauses / SCC","summary":"适用的欧盟标准跨境传输合同工具。","why":"用于确认双方角色、传输责任与保护安排。","confusion":"不是隐私告知、员工勾选同意或普通保密条款；也不能代替技术保护和必要评估。","sources":[{"source":"S04","start":134,"end":145},{"source":"S01","start":333,"end":339}],"related":["tia","dpa","bcr","transfer"]},{"id":"tia","type":"术语","module":"G4","title":"传输影响评估","en":"Transfer Impact Assessment / TIA","summary":"结合接收地法律与实际路径，评估传输保障是否有效及需何补充措施。","why":"支撑依赖 SCC 一类机制的传输判断。","confusion":"签 SCC 不意味着风险评估自动完成；TIA 也不是独立传输机制。","sources":[{"source":"S04","start":134,"end":145},{"source":"S07","start":13,"end":17}],"related":["scc","transfer","dpia"]},{"id":"bcr","type":"术语","module":"G4","title":"约束性公司规则","en":"Binding Corporate Rules / BCR","summary":"跨国集团内部适用、需监管批准的数据保护规则。","why":"可作为集团内部特定传输的工具。","confusion":"不等于集团自行写的一份内部制度。","sources":[{"source":"S01","start":333,"end":339},{"source":"S10","start":63,"end":67}],"related":["scc","transfer"]},{"id":"controller","type":"术语","module":"G4","title":"控制者与处理者","en":"Controller / Processor","summary":"控制者决定处理目的和关键方式；处理者代表其处理个人数据。","why":"先界定角色，才能分配协议、权利响应与事件责任。","confusion":"角色按实际活动判断；同集团不等于同一控制者，产品名也不是法律责任主体。","sources":[{"source":"S01","start":380,"end":395},{"source":"S04","start":118,"end":153}],"related":["dpa","subprocessor","transfer"]},{"id":"subprocessor","type":"术语","module":"G4","title":"子处理者／再委托处理者","en":"Sub-processor","summary":"处理者进一步委托、参与处理个人数据的另一主体。","why":"登记处理服务、区域、范围、保留和变更。","confusion":"并非所有第三方供应商自动都属同一种角色，需看是否处理个人数据及实际关系。","sources":[{"source":"S04","start":118,"end":128},{"source":"S05","start":59,"end":67}],"related":["controller","dpa","endpoint","retention"]},{"id":"dpa","type":"术语","module":"G4","title":"数据处理协议","en":"Data Processing Agreement","summary":"约定控制者与处理者关系、处理范围、安全措施和再委托等事项的协议。","why":"把系统数据事实转为双方可执行责任。","confusion":"DPA 和跨境 SCC 解决的问题不同，可有关联但不能相互替代。","sources":[{"source":"S04","start":134,"end":145},{"source":"S01","start":380,"end":395}],"related":["controller","scc","subprocessor"]},{"id":"dpia","type":"术语","module":"G4","title":"数据保护影响评估","en":"Data Protection Impact Assessment / DPIA","summary":"针对可能造成高风险的个人数据处理进行事先评估。","why":"供应商提供数据流、处理说明和安全措施供客户评估。","confusion":"不是对每份普通合同都自动开展，也不能与 TIA 混为一谈。","sources":[{"source":"S05","start":90,"end":100},{"source":"S01","start":386,"end":395}],"related":["tia","dpo","ropa"]},{"id":"dpo","type":"术语","module":"G4","title":"数据保护官","en":"Data Protection Officer / DPO","summary":"在适用情形下监督、建议并联系数据保护事务的专业角色。","why":"是客户法务和 IT 确认隐私边界的重要参与方。","confusion":"是否必须设立须依实际处理和法定条件判断。","sources":[{"source":"S04","start":147,"end":153},{"source":"S01","start":864,"end":895}],"related":["dpia","gdpr"]},{"id":"ropa","type":"术语","module":"G4","title":"处理活动记录","en":"Record of Processing Activities / ROPA","summary":"记录处理目的、数据类别、接收者、传输和保护措施等活动信息。","why":"数据流地图、权利响应和尽调的共同依据。","confusion":"不等同于每一次用户点击的运行审计日志。","sources":[{"source":"S04","start":134,"end":145},{"source":"S05","start":90,"end":100}],"related":["audit","dsr","scope"]},{"id":"pii","type":"术语","module":"G4","title":"个人数据","en":"Personal Data / PII","summary":"与已识别或可识别自然人有关的信息。","why":"姓名、邮箱、签署记录和可关联的日志都可能落入范围。","confusion":"不只合同正文；生物识别是否属特殊类别还取决于用途和条件。","sources":[{"source":"S10","start":55,"end":67},{"source":"S01","start":345,"end":355}],"related":["gdpr","pseudonym","anonymous","dsr"]},{"id":"dsr","type":"术语","module":"G4","title":"数据主体权利请求","en":"DSR / DSAR","summary":"个人提出访问、更正、删除、限制或可携带等请求。","why":"需要定位、评估、执行、答复和留痕的闭环。","confusion":"访问请求不是随意导出他人数据；删除也不是无条件抹掉合同证据。","sources":[{"source":"S05","start":80,"end":88},{"source":"S01","start":345,"end":357}],"related":["pii","hold","retention"]},{"id":"retention","type":"术语","module":"G4","title":"数据保留策略","en":"Retention Policy","summary":"按目的、法律依据和数据类型约定保存多久、到期做什么。","why":"控制账号、日志、证据、备份和第三方数据的生命周期。","confusion":"12／24 个月是原方案示例，不是统一法定期限；不训练不等于零留存。","sources":[{"source":"S01","start":345,"end":357},{"source":"S05","start":80,"end":88}],"related":["hold","dsr","subprocessor"]},{"id":"hold","type":"术语","module":"G4","title":"法律保全","en":"Legal Hold","summary":"因诉讼、调查或争议需要，暂停原定删除并保存相关证据。","why":"与保留策略、签署归档和删除请求联动。","confusion":"不是无期限保留所有数据的通用理由，应有范围、依据与解除条件。","sources":[{"source":"S01","start":345,"end":355},{"source":"S01","start":864,"end":895},{"source":"S08","start":549,"end":553}],"related":["retention","evidence","dsr"]},{"id":"pseudonym","type":"术语","module":"G4","title":"去标识化／假名化","en":"Pseudonymisation","summary":"降低直接识别能力，但在存在附加信息等条件下仍可能识别个人。","why":"可减少暴露风险，需管理关联密钥和重识别路径。","confusion":"不能自动当作匿名数据或据此宣称免除所有传输义务。","sources":[{"source":"S01","start":341,"end":343},{"source":"S04","start":212,"end":220}],"related":["anonymous","pii","transfer"]},{"id":"anonymous","type":"术语","module":"G4","title":"匿名化与聚合","en":"Anonymisation / Aggregation","summary":"匿名化目标是不能再合理识别个人；聚合只是统计处理，仍需检验识别风险。","why":"总部看板可优先使用必要的汇总信息。","confusion":"“删除姓名”或“改成统计表”不自动等于匿名。","sources":[{"source":"S01","start":341,"end":343},{"source":"S06","start":82,"end":90}],"related":["pseudonym","transfer","reporting"]},{"id":"lockbox","type":"术语","module":"G4","title":"逐次支持访问审批","en":"Customer Lockbox pattern","summary":"客户按一次支持任务批准或拒绝供应商访问，并限定期限、权限与记录。","why":"把远程排障变为可审计的例外路径。","confusion":"仅有堡垒机日志不等于已有客户逐次审批机制。","sources":[{"source":"S05","start":69,"end":78},{"source":"S07","start":332,"end":340}],"related":["least","audit","transfer"]},{"id":"scope","type":"术语","module":"G4","title":"驻留纳入／排除范围","en":"In-scope / Out-of-scope","summary":"明确哪些对象和处理活动受区域承诺约束，哪些另有安排。","why":"覆盖正文、附件、索引、日志、遥测、账号和支持工单。","confusion":"不能把“不在驻留范围”理解为不受数据保护义务约束。","sources":[{"source":"S05","start":48,"end":67},{"source":"S05","start":115,"end":124}],"related":["residency","ropa","subprocessor"]},{"id":"byok","type":"术语","module":"G4","title":"客户管理与自持密钥","en":"CMK / BYOK / HYOK","summary":"分别关注客户控制密钥、客户生成后导入，以及外部持钥等不同管理模式。","why":"客户若要求供应商无法解密，需要进一步核对应用和解密架构。","confusion":"不是简单的强弱排列；BYOK 通常不等于供应商在任何情形下都不能解密。","sources":[{"source":"S05","start":69,"end":78},{"source":"S01","start":400,"end":406}],"related":["sovereignty","residency"]},{"id":"works","type":"术语","module":"G4","title":"职工委员会","en":"Betriebsrat","summary":"德国企业的员工代表机制，特定技术监控设施可能涉及共同决定程序。","why":"审计和员工行为相关功能上线前需客户评估劳动法程序。","confusion":"并非所有企业都存在职工委员会，也不能不看适用条件就断言全系统不得上线。","sources":[{"source":"S01","start":359,"end":378},{"source":"S10","start":55,"end":73}],"related":["audit","dpo"]},{"id":"instance","type":"术语","module":"G5","title":"独立实例","en":"Independent Instance","summary":"独立部署运行、资源和数据边界可明确的一套系统环境。","why":"承载区域运行、升级与运维。","confusion":"不等于一个租户；同一实例可服务多个法人。","sources":[{"source":"S07","start":79,"end":102},{"source":"S01","start":141,"end":172}],"related":["tenant","region","fork"]},{"id":"tenant","type":"术语","module":"G4","title":"租户","en":"Tenant","summary":"系统中管理配置、身份和数据边界的业务空间。","why":"可容纳一个集团及多个企业。","confusion":"逻辑隔离不自动意味着独立机房或区域驻留。","sources":[{"source":"S04","start":10,"end":16},{"source":"S11","start":179,"end":194}],"related":["legalentity","instance","rbac"]},{"id":"legalentity","type":"术语","module":"GOV","title":"法人／签约主体","en":"Legal Entity","summary":"承担签约和责任的法律实体；是本材料组织与本位币设计的重要层级。","why":"挂载主体、权限、业务时区和币种等上下文。","confusion":"组织部门、系统企业节点和法律法人不天然一一等同，需映射确认。","sources":[{"source":"S01","start":81,"end":98},{"source":"S01","start":465,"end":474},{"source":"S13","start":7,"end":12}],"related":["tenant","functional","mdm"]},{"id":"region","type":"术语","module":"G5","title":"区域与云区域","en":"Region","summary":"业务治理区域、法域和云基础设施区域分别定义。","why":"决定部署、副本、端点与扩展单元。","confusion":"“欧洲区域”不自动等于所有欧洲国家或 EMEA；物理云区域也不是法域。","sources":[{"source":"S07","start":33,"end":44},{"source":"S07","start":59,"end":66},{"source":"S04","start":30,"end":48}],"related":["eea","az","residency"]},{"id":"vpc","type":"术语","module":"G5","title":"虚拟私有云","en":"Virtual Private Cloud / VPC","summary":"云环境内隔离的网络空间。","why":"客户指定环境中定义网络、出口和访问路径。","confusion":"VPC 不等于客户自有账号，也不等于数据绝不离开。","sources":[{"source":"S07","start":33,"end":42},{"source":"S07","start":448,"end":458}],"related":["byoc","instance","endpoint"]},{"id":"byoc","type":"术语","module":"G5","title":"客户自带云环境","en":"Bring Your Own Cloud / BYOC","summary":"在客户持有的云环境或账号内运行服务的交付模式。","why":"影响权限、费用、运维与部署责任。","confusion":"BYOC、独立实例和主权云各有不同侧重点。","sources":[{"source":"S07","start":412,"end":418},{"source":"S07","start":448,"end":458}],"related":["vpc","instance","sovereignty"]},{"id":"az","type":"术语","module":"G5","title":"可用区","en":"Availability Zone / AZ","summary":"同一云区域内具有隔离故障域的数据中心设施分组。","why":"支持区域内高可用设计。","confusion":"多个可用区不等于跨法域，也不等于已有跨区域灾备。","sources":[{"source":"S01","start":931,"end":949},{"source":"S07","start":170,"end":178}],"related":["region","dr"]},{"id":"dr","type":"术语","module":"G5","title":"灾难恢复","en":"Disaster Recovery / DR","summary":"在严重故障后恢复服务和数据的一组技术与流程。","why":"需要副本位置、恢复步骤和演练证据。","confusion":"有备份不等于能按目标恢复；容灾不等于全球多实例。","sources":[{"source":"S07","start":170,"end":178},{"source":"S07","start":354,"end":369}],"related":["rto","rpo","az"]},{"id":"rto","type":"术语","module":"G5","title":"恢复时间目标","en":"Recovery Time Objective / RTO","summary":"故障后最多可接受多久恢复服务。","why":"影响部署冗余、运维和恢复流程。","confusion":"4 小时是原文建议，未签约前不能作为承诺。","sources":[{"source":"S07","start":170,"end":178}],"related":["rpo","dr","sla"]},{"id":"rpo","type":"术语","module":"G5","title":"恢复点目标","en":"Recovery Point Objective / RPO","summary":"故障时最多可接受回退多长时间的数据。","why":"影响复制频率、备份策略与成本。","confusion":"RPO 不表示恢复服务所需时间。","sources":[{"source":"S07","start":170,"end":178}],"related":["rto","dr"]},{"id":"cdn","type":"术语","module":"G5","title":"内容分发网络","en":"Content Delivery Network / CDN","summary":"把可缓存资源分发到更近节点以改善访问。","why":"原方案仅允许公共 CDN 缓存静态资源。","confusion":"合同正文、附件、API 响应不能因加速需求就默认进入公共缓存。","sources":[{"source":"S07","start":234,"end":241},{"source":"S07","start":265,"end":273}],"related":["rtt","residency"]},{"id":"rtt","type":"术语","module":"G5","title":"往返时延","en":"Round-Trip Time / RTT","summary":"一次网络请求在链路往返的时间指标。","why":"用于网络选址参考和终端实测。","confusion":"RTT 低不保证文件解析、页面查询和大附件上传都快；公开区间不是现场 SLA。","sources":[{"source":"S07","start":206,"end":241},{"source":"S07","start":591,"end":591}],"related":["cdn","sla"]},{"id":"tls","type":"术语","module":"G5","title":"传输加密与双向认证","en":"TLS / mTLS","summary":"TLS 保护传输；mTLS 还要求通信双方出示证书。","why":"用于终端和系统间安全通信。","confusion":"传输加密不替代业务授权或跨境依据。","sources":[{"source":"S07","start":265,"end":283}],"related":["least","endpoint"]},{"id":"waf","type":"术语","module":"G5","title":"应用防火墙","en":"Web Application Firewall / WAF","summary":"在应用入口检测和拦截常见恶意流量的防护。","why":"与网关、限流和日志组成接入层。","confusion":"不代表合同级权限或合规检查已完成。","sources":[{"source":"S07","start":265,"end":273}],"related":["tls","cdn"]},{"id":"mailauth","type":"术语","module":"G5","title":"邮件域名认证","en":"SPF / DKIM / DMARC","summary":"声明可信发信源、给邮件签名并制定域名认证处置策略。","why":"提高域名可信度并支撑境外通知投递。","confusion":"配置成功也不保证所有邮件都进入收件箱，仍要实测。","sources":[{"source":"S07","start":275,"end":283},{"source":"S07","start":234,"end":241}],"related":["endpoint","audit"]},{"id":"sla","type":"术语","module":"G5","title":"服务等级与业务时限","en":"Service Level Agreement / SLA","summary":"可指可用性和支持响应承诺；产品内也使用审批办理时限这一概念。","why":"先辨别在谈运行服务还是某一任务的到期规则。","confusion":"99.9% 可用性、4 小时恢复、两个工作日审批是不同指标。","sources":[{"source":"S07","start":309,"end":328},{"source":"S03","start":24,"end":36}],"related":["calendar","rto","sow"]},{"id":"sow","type":"术语","module":"G5","title":"工作说明书","en":"Statement of Work / SOW","summary":"约定项目范围、交付、责任及验收的合同文件。","why":"把运维界面与建设边界写成可执行约定。","confusion":"研究稿与建议值不是自动生效的 SOW。","sources":[{"source":"S07","start":295,"end":307},{"source":"S07","start":551,"end":565}],"related":["sla","uat"]},{"id":"uat","type":"术语","module":"G5","title":"用户验收测试","en":"User Acceptance Testing / UAT","summary":"在拟上线环境由相关方核对真实业务和验收标准。","why":"验证登录、合同办理、输出、灾备和升级。","confusion":"仅能启动程序或演示原型不代表 UAT 通过。","sources":[{"source":"S07","start":354,"end":369},{"source":"S07","start":91,"end":102}],"related":["sow","fork"]},{"id":"fork","type":"术语","module":"G5","title":"独立代码分支与版本漂移","en":"Fork / Version Drift","summary":"区域长期单独改代码，逐渐偏离标品主线的现象。","why":"增加升级、修复和回归成本。","confusion":"独立部署不必然要独立源码分支；差异可用配置和适配器管理。","sources":[{"source":"S07","start":91,"end":102},{"source":"S07","start":420,"end":430}],"related":["adapter","config","uat"]},{"id":"remotehands","type":"术语","module":"G5","title":"机房代操作服务","en":"Remote Hands / Smart Hands","summary":"机房人员代客户重启设备、更换硬盘等现场操作。","why":"需要授权、留痕、安全销毁与责任边界。","confusion":"是否为处理者取决于实际接触和处理活动，不能单凭硬件所有权认定。","sources":[{"source":"S06","start":37,"end":49},{"source":"S06","start":106,"end":115}],"related":["controller","dpa","lockbox"]},{"id":"dataact","type":"术语","module":"G5","title":"欧盟数据法与服务切换","en":"EU Data Act","summary":"原材料关注其云服务切换、数据导出与防锁定要求。","why":"推动导出格式、退出协助、数据返还与删除条款。","confusion":"费用、时限和适用例外应按现行法规与服务模式确认，未在本次全面复核。","sources":[{"source":"S07","start":385,"end":395},{"source":"S05","start":80,"end":88}],"related":["sow","retention"]},{"id":"nis2","type":"术语","module":"G5","title":"网络与信息系统安全指令","en":"NIS2","summary":"欧盟组织与供应链网络安全框架，需结合成员国落地规则。","why":"客户安全义务可能传导到供应商尽调和事件通报。","confusion":"不能只凭行业名称判定客户恒为某档实体；与 GDPR 泄露报告是不同制度。","sources":[{"source":"S07","start":375,"end":383},{"source":"S07","start":322,"end":330}],"related":["sla","audit","sow"]},{"id":"kvkk","type":"术语","module":"G4","title":"土耳其数据保护法","en":"KVKK","summary":"土耳其个人数据保护制度，涉及该国数据与访问时需要单独分析。","why":"欧洲部署不能自动覆盖其输入和输出的所有路径。","confusion":"土耳其→EEA 与 EEA→土耳其方向不同，不能混用欧盟 SCC 与土耳其标准合同。","sources":[{"source":"S07","start":252,"end":261},{"source":"S07","start":408,"end":410}],"related":["transfer","scc","jurisdiction"]},{"id":"aiact","type":"术语","module":"G4","title":"欧盟人工智能法案","en":"EU AI Act","summary":"原材料讨论 AI 使用场景、角色、透明度及风险分类义务。","why":"启用 MeCheck 或其他 AI 前需要确认实际用途、处理区域与责任。","confusion":"原文关于分阶段日期与延期的说法未实时复核；不把研究日期当作当前法律结论。","sources":[{"source":"S07","start":397,"end":406}],"related":["mecheck","pii","subprocessor"]},{"id":"eidas","type":"术语","module":"G6","title":"电子身份与信任服务规则","en":"eIDAS / eIDAS 2.0","summary":"欧盟电子身份、电子签名和信任服务框架；后续修订引入数字身份钱包等机制。","why":"为签名等级与信任服务核查提供框架。","confusion":"不会自动消除成员国对具体文书的形式限制。","sources":[{"source":"S08","start":101,"end":137}],"related":["ses","aes","qes","eudi"]},{"id":"ses","type":"术语","module":"G6","title":"简单电子签名","en":"Simple Electronic Signature / SES","summary":"电子形式表达签署意思的基础签名类别。","why":"低风险确认可在合法性与证据要求确认后使用。","confusion":"有电子签不等于已满足 AES 或 QES。","sources":[{"source":"S08","start":103,"end":117}],"related":["aes","qes","eidas"]},{"id":"aes","type":"术语","module":"G6","title":"高级电子签名","en":"Advanced Electronic Signature / AES / AdES","summary":"满足唯一关联、可识别、控制要求及改动可检测等法定条件的电子签名。","why":"用于需要较强身份与完整性证据的签署方案。","confusion":"短信 OTP 或涂鸦只是可能的流程部件，不能单独证明满足全部条件。","sources":[{"source":"S08","start":103,"end":117}],"related":["ses","qes","eid"]},{"id":"qes","type":"术语","module":"G6","title":"合格电子签名","en":"Qualified Electronic Signature / QES","summary":"在高级电子签名基础上，使用合格签名创建设备并基于合格证书。","why":"欧盟框架赋予其与手写签名等同的法律效力。","confusion":"不等于公证、不保证任何文件都能电子签；也不推出所有场景统一举证责任倒置。","sources":[{"source":"S08","start":103,"end":125}],"related":["aes","qtsp","qscd","trusted"]},{"id":"qtsp","type":"术语","module":"G6","title":"合格信任服务提供者","en":"Qualified Trust Service Provider / QTSP","summary":"对特定合格信任服务取得相应资格并列入国家信任列表的主体。","why":"QES 要核查具体服务、状态和签署时点。","confusion":"品牌提供电子签平台，不代表其所有服务均为合格服务；比“电子公证机构”更准确。","sources":[{"source":"S08","start":50,"end":54},{"source":"S08","start":119,"end":125}],"related":["qes","trusted","qscd"]},{"id":"qscd","type":"术语","module":"G6","title":"合格签名创建设备","en":"Qualified Signature Creation Device / QSCD","summary":"满足合格签名创建要求的设备，可涉及远程管理模式。","why":"是 QES 要件之一。","confusion":"有合格证书而没有满足条件的创建过程，不能直接认定 QES。","sources":[{"source":"S08","start":111,"end":115},{"source":"S01","start":897,"end":908}],"related":["qes","qtsp"]},{"id":"trusted","type":"术语","module":"G6","title":"信任列表与 LOTL","en":"Trusted List / List of Trusted Lists","summary":"成员国合格信任服务记录及欧盟信任列表的汇总指引。","why":"用于核查服务资格、种类、状态和历史。","confusion":"不能只查机构名字，忽略具体服务与签署时点；长期验证仍需保存证据。","sources":[{"source":"S08","start":119,"end":125}],"related":["qtsp","ltv","timestamp"]},{"id":"eid","type":"术语","module":"G6","title":"电子身份核验","en":"Electronic Identification / eID","summary":"用数字身份手段证明“是谁”，如国家或银行身份系统。","why":"签署前按国家和场景选择核验方式。","confusion":"身份保证等级与签名等级是不同刻度，核身成功不自动等于 QES。","sources":[{"source":"S08","start":38,"end":42},{"source":"S08","start":526,"end":531}],"related":["eudi","aes","authorization"]},{"id":"authorization","type":"术语","module":"G6","title":"签署人代表权与授权链","en":"Signing Authority / Power of Attorney","summary":"证明某自然人有权代表某法人完成特定签署的关系和文件。","why":"签署任务需关联授权证明、委托与代签记录。","confusion":"证明“这个人是谁”不等于证明“他有权代表公司签”。","sources":[{"source":"S08","start":526,"end":531},{"source":"S01","start":730,"end":738}],"related":["eid","legalentity","evidence"]},{"id":"eudi","type":"术语","module":"G6","title":"欧盟数字身份钱包","en":"European Digital Identity Wallet","summary":"用于提供数字身份、属性证明和相关签署能力的钱包机制。","why":"作为后续身份和签署通道预留适配。","confusion":"原文时间表与行业接受范围未全面复核，不能推定所有 CLM 客户在同一天必须接入。","sources":[{"source":"S08","start":127,"end":137},{"source":"S08","start":323,"end":323}],"related":["eid","eidas","qes"]},{"id":"envelope","type":"术语","module":"G6","title":"信封／签署任务","en":"Envelope / Signing Request","summary":"外部平台中组织文档、收件人、字段和状态的一次签署请求对象。","why":"需要映射到 MeFlow 内部合同和任务标识。","confusion":"一次批量业务可能产生多个信封；不等于一个文件或一个签署人。","sources":[{"source":"S08","start":353,"end":365},{"source":"S01","start":909,"end":912}],"related":["adapter","evidence","webhook"]},{"id":"webhook","type":"术语","module":"G6","title":"事件回调","en":"Webhook","summary":"服务商在签署状态变化时向约定地址主动通知。","why":"驱动状态回写和证据回收。","confusion":"收到请求不代表可信；需验证、去重、异常处理和适当补偿。","sources":[{"source":"S08","start":264,"end":269},{"source":"S08","start":353,"end":390}],"related":["idempotent","envelope","audit"]},{"id":"idempotent","type":"术语","module":"G6","title":"幂等与状态机","en":"Idempotency / State Machine","summary":"同一事件重复处理不产生重复业务后果，状态按允许的规则变化。","why":"避免重复回调造成重复归档或状态倒退。","confusion":"“只记日志”不能代替失败补偿；乱序事件也需处理。","sources":[{"source":"S08","start":264,"end":269},{"source":"S08","start":381,"end":390}],"related":["webhook","evidence"]},{"id":"evidence","type":"术语","module":"G6","title":"签署证据包","en":"Evidence Package","summary":"签署文件、身份与授权证据、时间、哈希、证书和审计轨迹的组合。","why":"把签署结果变为可查、可导出、可长期验证的合同证据。","confusion":"完成证书不是合格数字证书；只存 PDF 或截图未必足够。","sources":[{"source":"S08","start":533,"end":553}],"related":["hash","timestamp","ltv","hold"]},{"id":"hash","type":"术语","module":"G6","title":"文档哈希","en":"Document Hash / SHA-256","summary":"对特定字节内容计算的摘要，可用于检测文件内容变化。","why":"关联送签版本与回收文件并支持完整性核对。","confusion":"签署会改变 PDF 字节，不能机械要求送签件与已签件哈希相同；要验证对应关系和签名。","sources":[{"source":"S08","start":244,"end":269},{"source":"S08","start":535,"end":553}],"related":["evidence","ltv","template"]},{"id":"timestamp","type":"术语","module":"G6","title":"时间戳与证书状态","en":"Timestamp / Revocation Status","summary":"记录相关数据在某时点存在及验证签名所需的时间与证书状态材料。","why":"帮助证明签署时点的完整性与资格。","confusion":"普通数据库时间字段不等于合格时间戳；也并非所有 QES 自动自带完整长期验证资料。","sources":[{"source":"S08","start":119,"end":125},{"source":"S08","start":533,"end":553}],"related":["ltv","trusted","evidence"]},{"id":"ltv","type":"术语","module":"G6","title":"长期验证","en":"Long-Term Validation / LTV","summary":"使签名在证书过期或服务变化后仍可按保存材料验证的能力。","why":"保存证书链、吊销信息、时间戳及更新安排。","confusion":"不意味着任意文件永久离线有效，仍有格式、信任与续存要求。","sources":[{"source":"S08","start":533,"end":553}],"related":["pades","timestamp","evidence"]},{"id":"pades","type":"术语","module":"G6","title":"PDF 长期签名格式","en":"PAdES / PAdES-LTA","summary":"适用于 PDF 的高级电子签名标准及长期保存验证材料的相应级别。","why":"是长期证据归档的候选技术路径。","confusion":"不等同于已证明签名为 QES，也不是只改文件扩展名。","sources":[{"source":"S08","start":215,"end":225},{"source":"S08","start":549,"end":553}],"related":["ltv","qes","hash"]},{"id":"branding","type":"术语","module":"G6","title":"品牌化、白标与嵌签","en":"Branding / White-label / Embedded Signing","summary":"品牌化修改视觉标识；白标涉及更广品牌隐藏；嵌签指在应用内承载签署体验。","why":"决定商务授权、体验与身份责任。","confusion":"三者彼此独立，嵌签不自动意味着白标。","sources":[{"source":"S01","start":769,"end":781},{"source":"S08","start":340,"end":391}],"related":["adapter","eid"]},{"id":"jurisdiction","type":"术语","module":"G6","title":"准据法与法域","en":"Governing Law / Jurisdiction","summary":"合同适用法律、主体所在地和签署形式要求需要分别确认。","why":"决定能否电子签、等级、互认与证据要求。","confusion":"界面语言或签署人 IP 不能代替法律适用判断。","sources":[{"source":"S08","start":139,"end":162},{"source":"S08","start":275,"end":285}],"related":["eidas","transfer","qes"]},{"id":"adapter","type":"术语","module":"GOV","title":"区域／服务适配器","en":"Regional / Provider Adapter","summary":"在统一业务接口下封装不同外部服务调用的组件。","why":"使电子签、OCR、AI、办公与邮件可以按区域替换。","confusion":"适配器解决接入差异，不自动证明服务合规或数据同区。","sources":[{"source":"S07","start":91,"end":102},{"source":"S08","start":264,"end":269},{"source":"S04","start":118,"end":128}],"related":["endpoint","fork","config"]},{"id":"endpoint","type":"术语","module":"G5","title":"服务端点","en":"Service Endpoint / Base URI","summary":"某账号或区域调用服务的实际地址与入口。","why":"影响认证、服务可用性和数据路径。","confusion":"域名含“EU”或走代理不能独立证明处理全过程在 EEA。","sources":[{"source":"S08","start":353,"end":390},{"source":"S04","start":118,"end":128}],"related":["adapter","subprocessor","region"]},{"id":"failclosed","type":"术语","module":"G4","title":"策略失败时拒绝","en":"Fail Closed","summary":"不能满足或判断保护策略时，拒绝操作或转人工。","why":"避免能力故障时静默扩大数据处理范围。","confusion":"不是所有故障都停止全系统，应对具体动作定义拒绝与降级。","sources":[{"source":"S04","start":116,"end":124},{"source":"S05","start":59,"end":67}],"related":["endpoint","least","adapter"]},{"id":"sso","type":"术语","module":"IAM","title":"单点登录","en":"Single Sign-On / SSO","summary":"使用企业统一身份认证进入多个应用的能力。","why":"减少重复账号并接入客户安全控制。","confusion":"能单点登录不等于完成账号自动停用或业务授权。","sources":[{"source":"S10","start":8,"end":17}],"related":["idp","saml","oidc","scim"]},{"id":"idp","type":"术语","module":"IAM","title":"身份提供者","en":"Identity Provider / IdP","summary":"负责验证身份并向应用提供认证结果的系统。","why":"通常由客户企业统一管理。","confusion":"IdP 决定身份认证，应用仍要校验凭证并执行合同权限。","sources":[{"source":"S10","start":8,"end":17}],"related":["sp","oidc","saml","mapping"]},{"id":"sp","type":"术语","module":"IAM","title":"服务提供者／依赖方","en":"Service Provider / Relying Party","summary":"依赖企业身份结果提供业务服务的应用角色，本场景为 MeFlow。","why":"负责接收并校验认证结果，建立应用会话。","confusion":"采用 OIDC 时常称 RP，与 SAML 的 SP 术语需区分上下文。","sources":[{"source":"S10","start":8,"end":17}],"related":["idp","assertion","session"]},{"id":"saml","type":"术语","module":"IAM","title":"SAML 2.0","en":"Security Assertion Markup Language","summary":"企业联邦认证协议，使用 XML 断言等消息。","why":"常用于企业门户与业务系统登录。","confusion":"证书轮换能否自动化取决于实现和元数据策略，不是必然手工。","sources":[{"source":"S10","start":8,"end":30}],"related":["oidc","assertion","rotation","slo"]},{"id":"oidc","type":"术语","module":"IAM","title":"开放身份连接","en":"OpenID Connect / OIDC","summary":"在 OAuth 2.0 之上提供身份认证层，使用 ID Token 和身份声明。","why":"标准化登录认证及身份信息交换。","confusion":"不是“OAuth 不能用于任何登录”的简单二分；需正确采用身份协议与校验。","sources":[{"source":"S10","start":19,"end":30}],"related":["oauth","assertion","idp"]},{"id":"oauth","type":"术语","module":"IAM","title":"OAuth 授权框架","en":"OAuth 2.0","summary":"让应用按授权访问受保护资源的框架。","why":"用于 API 调用授权，也支撑 OIDC 等身份层。","confusion":"Access Token 不能不经正确协议和校验就当作完整身份认证结果。","sources":[{"source":"S10","start":19,"end":30},{"source":"S08","start":353,"end":390}],"related":["oidc","jwtgrant","assertion"]},{"id":"assertion","type":"术语","module":"IAM","title":"断言与 ID 令牌","en":"SAML Assertion / OIDC ID Token","summary":"身份系统签发、给目标应用验证的认证声明。","why":"必须检查签名、签发方、受众、时效及协议相关校验项。","confusion":"SAML 断言与 OIDC ID Token 不是同一个数据格式；Access Token 用途不同。","sources":[{"source":"S10","start":8,"end":17}],"related":["saml","oidc","oauth"]},{"id":"rotation","type":"术语","module":"IAM","title":"证书与签名密钥轮换","en":"Certificate / Key Rotation","summary":"身份或服务签名密钥更新与应用验证配置同步的过程。","why":"避免证书过期或替换造成登录中断。","confusion":"OIDC 的动态密钥读取也依赖实现，不能宣称永远不用管理。","sources":[{"source":"S10","start":8,"end":17}],"related":["saml","oidc","assertion"]},{"id":"slo","type":"术语","module":"IAM","title":"单点登出","en":"Single Logout / SLO","summary":"尝试把一个系统的退出联动到相关联邦会话的机制。","why":"需要明确应用会话、IdP 会话与设备间的退出范围。","confusion":"退出某个网页不自动代表所有应用、设备和令牌同时失效。","sources":[{"source":"S10","start":19,"end":30}],"related":["session","sso"]},{"id":"scim","type":"术语","module":"IAM","title":"跨域身份管理","en":"SCIM 2.0","summary":"标准化用户和组的预配置、更新及停用接口。","why":"联动入职、换岗、离职与账号生命周期。","confusion":"自动停号后的旧会话是否失效仍需应用策略验证。","sources":[{"source":"S10","start":32,"end":38}],"related":["jit","provisioning","mapping"]},{"id":"jit","type":"术语","module":"IAM","title":"首次登录即时建号","en":"Just-in-Time Provisioning / JIT","summary":"用户第一次认证通过时再创建应用账号。","why":"减少入职前手工开户。","confusion":"JIT 建号本身不解决离职和持续调权。","sources":[{"source":"S10","start":32,"end":38}],"related":["scim","provisioning"]},{"id":"provisioning","type":"术语","module":"IAM","title":"预配置与去配置","en":"Provisioning / Deprovisioning","summary":"为用户预建、更新账号与权限，以及停用和撤销访问。","why":"把人事和身份变化落实到应用。","confusion":"停用、删除个人数据和保留合同记录是不同动作。","sources":[{"source":"S10","start":32,"end":38}],"related":["scim","jit","retention"]},{"id":"mfa","type":"术语","module":"IAM","title":"多因素认证","en":"Multi-Factor Authentication / MFA","summary":"组合不同类别的认证因素提高登录保障。","why":"通常由客户 IdP 执行，特权访问尤其需对齐。","confusion":"不是简单地输两个密码，也不能未经适用性判断宣称法规一律要求同一方式。","sources":[{"source":"S10","start":40,"end":47},{"source":"S07","start":332,"end":340}],"related":["passkey","conditional","breakglass"]},{"id":"passkey","type":"术语","module":"IAM","title":"通行密钥与抗钓鱼认证","en":"Passkey / FIDO2","summary":"以设备或硬件认证器使用公钥等机制完成认证，支持更强抗钓鱼设计。","why":"是企业强认证的可评估方式。","confusion":"与签署 QES 等级无直接等号，是否接受取决于客户身份策略。","sources":[{"source":"S10","start":40,"end":47}],"related":["mfa","eid"]},{"id":"conditional","type":"术语","module":"IAM","title":"条件访问","en":"Conditional Access","summary":"基于设备、地点、风险等条件决定登录控制。","why":"通常由客户身份平台配置，与应用访问策略联动。","confusion":"登录条件通过不代表获得所有合同下载权限。","sources":[{"source":"S10","start":40,"end":49}],"related":["mfa","rbac","least"]},{"id":"rbac","type":"术语","module":"IAM","title":"基于角色的权限","en":"Role-Based Access Control / RBAC","summary":"通过角色决定用户可对哪些对象做哪些动作。","why":"需结合法人、区域和合同权限范围。","confusion":"认证是谁，与授权能做什么要分开验证。","sources":[{"source":"S10","start":40,"end":51},{"source":"S04","start":92,"end":116}],"related":["mapping","least","legalentity"]},{"id":"mapping","type":"术语","module":"IAM","title":"身份与主数据属性映射","en":"Attribute Mapping","summary":"将外部身份／主数据属性对应到内部账号、组织、法人和角色。","why":"关系到多法人识别和账号调权。","confusion":"邮箱域名可作线索，不能单独推定全部业务权限。","sources":[{"source":"S10","start":19,"end":49},{"source":"S13","start":7,"end":12}],"related":["hrd","mdm","rbac"]},{"id":"hrd","type":"术语","module":"IAM","title":"企业域名路由","en":"Home Realm Discovery / HRD","summary":"根据企业域名或上下文选择相应身份提供者。","why":"支持一个集团多域名、多身份系统接入。","confusion":"路由只决定去哪里认证，不决定最终能看哪份合同。","sources":[{"source":"S10","start":19,"end":30}],"related":["idp","mapping"]},{"id":"least","type":"术语","module":"IAM","title":"最小权限","en":"Least Privilege","summary":"仅授予完成当前业务所必需的数据和动作权限。","why":"用于总部访问、跨法人审批与支持排障。","confusion":"可查看不等于可下载、导出、分享或送入 AI。","sources":[{"source":"S04","start":104,"end":116},{"source":"S07","start":332,"end":340}],"related":["rbac","lockbox","failclosed"]},{"id":"breakglass","type":"术语","module":"IAM","title":"应急管理员","en":"Break-glass Account","summary":"常规企业身份链路故障时使用的受控备用管理身份。","why":"防止身份故障将必要运维完全锁在外部。","confusion":"应急账号不是绕过审计和最小权限的常驻后门。","sources":[{"source":"S10","start":40,"end":53}],"related":["mfa","audit","session"]},{"id":"session","type":"术语","module":"IAM","title":"应用会话","en":"Application Session","summary":"应用在认证后维护的持续登录状态与有效期。","why":"影响离职停用、退出和跨设备访问。","confusion":"IdP 停号、SSO 退出和应用会话失效不天然同时发生。","sources":[{"source":"S10","start":19,"end":38},{"source":"S10","start":40,"end":53}],"related":["slo","scim","assertion"]},{"id":"audit","type":"术语","module":"G4","title":"审计日志","en":"Audit Log","summary":"记录主体、动作、对象、结果和时间的可追溯事件。","why":"支持安全调查、配置变更和合同举证。","confusion":"审计日志可能含个人数据；不能不加区分地永久保存全部正文。","sources":[{"source":"S04","start":130,"end":132},{"source":"S10","start":40,"end":53}],"related":["siem","utc","retention"]},{"id":"siem","type":"术语","module":"IAM","title":"安全日志平台","en":"Security Information and Event Management / SIEM","summary":"集中收集、关联分析安全事件的平台。","why":"客户可能要求接入登录和敏感操作事件。","confusion":"输出日志本身也有数据范围与区域路径。","sources":[{"source":"S10","start":40,"end":53}],"related":["audit","subprocessor"]},{"id":"jwtgrant","type":"术语","module":"G6","title":"JWT 授权方式","en":"Docusign JWT Grant","summary":"一种代理指定用户向 Docusign 换取访问令牌的授权流程。","why":"服务端集成需同意、密钥管理、令牌缓存及到期重换。","confusion":"原文“一小时且无刷新令牌”仅针对 JWT Grant，授权码流程可提供刷新令牌。","sources":[{"source":"S08","start":353,"end":390}],"related":["oauth","endpoint","rotation"]},{"id":"controlplane","type":"术语","module":"GOV","title":"控制平面","en":"Control Plane","summary":"管理配置、版本、节点和运维编排的功能层。","why":"全球方案把总部配置治理和区域业务运行分开。","confusion":"仅部署业务节点在本地，不能推定所有管理与处理数据也在本地。","sources":[{"source":"S06","start":21,"end":35},{"source":"S13","start":7,"end":27}],"related":["dataplane","config","heartbeat"]},{"id":"dataplane","type":"术语","module":"GOV","title":"业务／数据平面","en":"Business / Data Plane","summary":"实际运行合同业务、处理和保存业务数据的区域能力层。","why":"与总部配置定义分工，并接受区域策略约束。","confusion":"全局统一配置不等于合同数据库全球共享。","sources":[{"source":"S13","start":7,"end":27},{"source":"S05","start":23,"end":33}],"related":["controlplane","instance","region"]},{"id":"config","type":"术语","module":"GOV","title":"配置版本与分发","en":"Configuration Version / Distribution","summary":"把流程、模板、表单和规则打包为有版本的配置并下发。","why":"保证区域执行的是经批准的一套标准。","confusion":"源码版本、总部配置版本和区域本地配置需要分别辨别。","sources":[{"source":"S13","start":7,"end":27},{"source":"S07","start":91,"end":102}],"related":["controlplane","fork","heartbeat"]},{"id":"heartbeat","type":"术语","module":"GOV","title":"注册、心跳与版本对账","en":"Registration / Heartbeat / Reconciliation","summary":"区域节点报告身份、在线状态、健康及配置版本的治理动作。","why":"支撑区域发现、断连告警和恢复。","confusion":"有心跳不代表所有业务正确，也未定义断连期间可继续哪些动作。","sources":[{"source":"S13","start":7,"end":27}],"related":["config","controlplane"]},{"id":"mdm","type":"术语","module":"GOV","title":"主数据管理","en":"Master Data Management / MDM","summary":"统一组织、人员、客户供应商等基础对象标识与口径的体系或系统。","why":"先解决多个系统中“同一个主体是谁”。","confusion":"MDM 不等于 ERP；组织人员、内外部相对方与物料财务业务范围要分开。","sources":[{"source":"S13","start":7,"end":12},{"source":"S13","start":104,"end":110}],"related":["legalentity","mapping","erp"]},{"id":"snapshot","type":"术语","module":"GOV","title":"主数据快照与台账交换","en":"Snapshot / Summary Exchange","summary":"在过渡架构中交换某时点基础数据或汇总信息的方式。","why":"允许独立实例先运行，再逐步建设统一配置通道。","confusion":"快照不代表实时双向同步，更不能自动解决跨境合法性。","sources":[{"source":"S13","start":7,"end":18}],"related":["mdm","transfer","config"]},{"id":"mecheck","type":"术语","module":"G4","title":"MeCheck 与 MeFlow","en":"mecheck3.0 / meflow3.0","summary":"MeFlow 负责智能化合同全生命周期管理；MeCheck 负责合同风险智能审查。","why":"国际化时审查服务的数据链路需与合同流程和权限衔接。","confusion":"资料主体为 MeFlow；不能把通用 AI 治理建议当作 MeCheck3.0 已有国际化功能。","sources":[{"source":"S07","start":568,"end":575},{"source":"S05","start":57,"end":67}],"related":["subprocessor","aiact","adapter"]}],"decisions":[{"id":"C01","type":"口径","module":"GOV","title":"“未记载”不能推定“没有”","summary":"缺口清单按发布说明覆盖情况判断；后续说明又记录了币种配置和合同币种选择已有基础。","action":"立项前分别核实标品、项目侧实现及拟建设项；本知识库所有“已有”仅代表源文记载。","owner":"产品负责人","sources":[{"source":"S11","start":10,"end":13},{"source":"S01","start":573,"end":584}],"related":["F06","F21","F32","F41"],"status":"证据边界","official":""},{"id":"C02","type":"口径","module":"G2","title":"汇率：早期枢纽换算与后续简化有差异","summary":"9 月素材建议枢纽与交叉换算；10 月说明按各币种对报告币种维护，并写明系统内不做交叉换算。其同时要求折算法人本位币，目标币不同时仍有未说明的路径。"," <script>
'use strict';
const D=JSON.parse(document.getElementById('kb-data').textContent);
const $=id=>document.getElementById(id), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state={view:'overview',module:'all',q:'',kind:'all',status:'all',graph:'G4'},lastFocus=null,sourceState=null,toastTimer;
const iconArrow='<span aria-hidden="true">↗</span>';
function hl(s){let out=E(s);const q=state.q.trim();if(!q)return out;const escaped=q.split(/\s+/).filter(Boolean).map(x=>E(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));try{return out.replace(new RegExp('('+escaped.join('|')+')','gi'),'<mark>$1</mark>')}catch{return out}}
function moduleSelect(){return '<select class="select" id="module-filter" aria-label="筛选能力主题"><option value="all">全部能力主题</option>'+D.modules.map(m=>`<option value="${m.id}" ${state.module===m.id?'selected':''}>${E(m.id+' · '+m.title)}</option>`).join('')+'</select>'}
function statusPill(s){const cls=s==='拟建设'?'':s==='官方校核'?'blue':/分歧|确认|假设/.test(s)?'warn':/边界|文档|部署|备选/.test(s)?'gray':'';return `<span class="pill ${cls}">${E(s)}</span>`}
function head(title,desc,tag='RESEARCH LIBRARY'){return `<div class="page-heading"><div><div class="eyebrow">${E(tag)}</div><h1>${E(title)}</h1><p>${E(desc)}</p></div></div>`}
function chips(ids){return `<div class="chip-row">${ids.filter(id=>byId.has(id)).map(id=>{const x=byId.get(id);return `<button class="chip" data-item="${id}">${x.type==='功能'?`<span class="tiny">${id}</span>`:''}${E(x.title)}</button>`}).join('')}</div>`}
function sourceRefs(rs){return `<div class="sources-list">${rs.map(r=>{const s=bySource.get(r.source);return `<button class="source-ref" data-source="${r.source}" data-start="${r.start}" data-end="${r.end}"><small>${r.source} · L${r.start}${r.end!==r.start?'–'+r.end:''} · 查看来源</small>${E(s.name)}</button>`}).join('')}</div>`}
function foot(){return '<footer class="footnote">提炼依据：13 份非大纲 Markdown 研究资料。功能与建议验收点为原文归纳，“已有”仅指源文记载，未作产品环境实测。<br>官方校核单独标识；原始文件中的外部引用和飞书链接未全部追溯。页面包含来源索引，可离线查找。详情见“来源与范围”。</footer>'}
function card(x){return `<button class="item-card" data-item="${x.id}"><div class="card-meta"><span>${E(x.type==='术语'?x.module:x.id)} · ${E(byModule.get(x.module).title)}</span>${x.status?statusPill(x.status):'<span>术语</span>'}</div><h3>${hl(x.title)}</h3>${x.en?`<div class="eng">${hl(x.en)}</div>`:''}<p>${hl(x.summary)}</p><div class="card-bottom"><span>${x.type==='功能'?x.terms.length+' 个关联术语 · '+x.sources.length+' 处来源':x.sources.length+' 处来源 · 查看关联'}</span><span class="arrow" aria-hidden="true">↗</span></div></button>`}
function overview(){return `<section class="hero"><div class="hero-copy"><div class="eyebrow">MEFLOW × GLOBALIZATION</div><h1>从功能到术语，<br>找到每个问题的依据。</h1><p>把分散的国际化研究整理成可查找的知识：要做什么、名词是什么意思、能力之间怎样关联，以及哪些结论仍需确认。</p><div class="hero-actions"><button class="btn primary" data-view="features">浏览功能说明 ${iconArrow}</button><button class="btn ghost" data-view="graph">查看知识关联 →</button></div></div><div class="hero-right"><div class="mini"><span>01</span><div>按主题找功能<br><small style="color:#9eb696">用途 · 建设内容 · 示例 · 建议验收</small></div></div><div class="mini"><span>02</span><div>沿关联理解知识<br><small style="color:#9eb696">术语互链 · 功能依赖 · 场景串讲</small></div></div><div class="mini"><span>03</span><div>核对来源与范围<br><small style="color:#9eb696">来源文件 · 引用行号 · 版本边界</small></div></div></div></section>
<div class="stats"><div class="stat"><strong>${D.features.length}</strong><span><b>功能说明</b>覆盖 8 个能力主题</span></div><div class="stat"><strong>${D.terms.length}</strong><span><b>专业术语</b>定义与易混点互查</span></div><div class="stat"><strong>${D.sources.length}</strong><span><b>研究来源</b>已排除 12 份大纲</span></div><div class="stat"><strong>${D.decisions.length}</strong><span><b>口径与待确认</b>保留分歧与证据边界</span></div></div>
<div class="section-head"><h2>按能力主题进入</h2><span class="hint">六项国际化主线 ＋ 两组共用能力</span></div><div class="module-grid">${D.modules.map(m=>`<button class="domain-card" data-module="${m.id}"><div class="domain-top"><span class="domain-index">${m.id}</span><span class="domain-arrow">↗</span></div><h3>${E(m.title)}</h3><p>${E(m.question)}</p><div class="count">${D.features.filter(x=>x.module===m.id).length} 项功能 · ${D.terms.filter(x=>x.module===m.id).length} 个术语</div></button>`).join('')}</div>
<div class="section-head"><h2>先看一份合同怎样跨境运转</h2><button class="text-link" data-scenario="SC01">进入完整场景 →</button></div><div class="flow-strip">${[['01','确定主体与边界','法人、身份与数据路径','F21'],['02','本地起草与录入','语种、金额与地区格式','F02'],['03','跨时区办理','业务时限与个人显示','F15'],['04','按场景签署','等级、核验与服务路由','F34'],['05','证据回收与留存','归档、验证与保全','F39']].map(a=>`<button class="flow-step" data-item="${a[3]}"><small>${a[0]}</small><strong>${a[1]}</strong><p>${a[2]}</p></button>`).join('')}</div>
<div class="section-head"><h2>从常见问题开始</h2><button class="text-link" data-view="scenarios">全部场景 →</button></div><div class="two-col"><section class="surface"><h3>容易混淆的知识</h3><div class="quick-list">${[['语言、地区格式、时区有什么区别？','F03'],['原币、本位币、报告币种各管什么？','F07'],['纯日期为什么不能做时区转换？','dateonly'],['SSO、SCIM、JIT 如何分工？','F42']].map(a=>`<button data-item="${a[1]}"><span>${a[0]}</span><span>↗</span></button>`).join('')}</div></section><section class="surface"><h3>方案中的关键边界</h3><div class="quick-list">${[['数据在欧洲，是否就不涉及跨境？','C08'],['汇率要做交叉换算，还是先简化？','C02'],['总部全量访问与区域合规怎样对齐？','C06'],['DocuSign 的令牌都不能刷新吗？','C09']].map(a=>`<button data-item="${a[1]}"><span>${a[0]}</span><span>↗</span></button>`).join('')}</div></section></div><div class="section-head"><h2>读懂资料的范围</h2><button class="text-link" data-view="sources">查看全部来源 →</button></div><div class="note"><strong>把事实、设计与未决问题分开。</strong>资料跨越能力缺口、专项研究、欧洲说明与全球化改造记录。“规划”“建议”“待讨论”均不表示已实现。全球覆盖数和服务商选择保留其原始适用范围；法律与协议概念的少量官方校核单独列示。</div>${foot()}`}
function match(x){const q=state.q.trim().toLocaleLowerCase();if(!q)return true;const corpus=JSON.stringify(x).toLocaleLowerCase()+' '+byModule.get(x.module).title+' '+(x.terms||[]).map(t=>JSON.stringify(byId.get(t))).join(' ').toLocaleLowerCase();return q.split(/\s+/).every(a=>corpus.includes(a))}
function browse(kind){const isSearch=kind==='search',isTerm=kind==='terms',list=isSearch?ALL:isTerm?D.terms:D.features;let items=list.filter(x=>(state.module==='all'||x.module===state.module)&&match(x));if(isSearch&&state.kind!=='all')items=items.filter(x=>x.type===state.kind);if(state.status!=='all')items=items.filter(x=>x.status===state.status);const title=isSearch?'搜索结果':isTerm?'术语词典':'功能说明';const desc=isSearch?'按名称、英文缩写、说明和关联术语检索。可组合主题与内容类型筛选。':isTerm?'先理解一句话定义，再看它为什么影响产品，以及最容易混淆的地方。':'每项包含业务用途、建设内容、示例、建议验收点与来源。建设属性是原文归纳，不代表已经实现。';return head(title,desc,isSearch?'SEARCH THE LIBRARY':isTerm?'TERMINOLOGY INDEX':'FUNCTION CATALOG')+`<div class="toolbar">${moduleSelect()}${isSearch?`<div class="segmented" aria-label="筛选内容类型">${[['all','全部'],['功能','功能'],['术语','术语'],['口径','口径']].map(a=>`<button data-kind="${a[0]}" class="${state.kind===a[0]?'active':''}">${a[1]}</button>`).join('')}</div>`:!isTerm?`<select class="select" id="status-filter" aria-label="筛选建设属性"><option value="all">全部建设属性</option>${[...new Set(D.features.map(x=>x.status))].map(s=>`<option ${state.status===s?'selected':''}>${E(s)}</option>`).join('')}</select>`:''}<button class="text-link" data-reset="1">重置筛选</button></div><div class="results-meta"><span>${state.q?'关键词「'+E(state.q)+'」 · ':''}找到 ${items.length} 条${state.module!=='all'?' · '+E(byModule.get(state.module).title):''}</span><span>${isTerm?'中文名称 / 英文缩写均可查找':'点击进入完整说明'}</span></div>${items.length?`<div class="card-grid">${items.map(card).join('')}</div>`:`<div class="empty"><h2>没有找到匹配的知识</h2><p>可尝试“时区”“QES”“汇率”“登录”，或放宽主题筛选。</p><button class="btn" data-reset="1">清空条件</button></div>`}${foot()}`}
function adjacent(x){const explicit=new Set(x.related||[]);if(x.type==='术语')D.features.filter(f=>f.terms.includes(x.id)).forEach(f=>explicit.add(f.id));if(x.type==='功能')D.features.filter(f=>f.related.includes(x.id)).forEach(f=>explicit.add(f.id));return [...explicit].map(id=>byId.get(id)).filter(Boolean)}
function officialBox(id){const w=D.official.find(x=>x.id===id);return w?`<div class="official-box"><b>官方校核 · ${w.id} · ${D.date}</b><br><a href="${E(w.url)}" target="_blank" rel="noopener noreferrer">${E(w.title)} ↗</a><br>${E(w.note)}</div>`:''}
function article(id){const x=byId.get(id);if(!x)return head('未找到该知识点','可通过目录或全库搜索重新定位。');const related=adjacent(x);let body='';if(x.type==='功能')body=`<section><h2>要建设什么</h2><ul>${x.build.map(b=>`<li>${E(b)}</li>`).join('')}</ul></section><section><h2>放进实际业务</h2><div class="example">${E(x.example)}</div></section><section><h2>建议怎样验收</h2><ul>${x.accept.map(b=>`<li>${E(b)}</li>`).join('')}</ul><p class="hint" style="margin-top:12px">以上是从研究内容归纳的验收建议，未作为产品实测结果。</p></section>${x.boundary?`<section><h2>范围与未决点</h2><div class="boundary">${E(x.boundary)}</div></section>`:''}<section><h2>读懂这些术语</h2>${chips(x.terms)}</section>`;else if(x.type==='术语')body=`<section><h2>为什么会影响产品</h2><div class="example">${E(x.why)}</div></section><section><h2>最容易混淆的地方</h2><div class="boundary">${E(x.confusion)}</div></section><section><h2>关联术语与知识</h2>${chips(x.related)}</section><section><h2>它出现在哪些功能中</h2>${chips(related.filter(r=>r.type==='功能').map(r=>r.id))||'<p class="hint">查看同主题功能了解上下文。</p>'}</section>`;else body=`<section><h2>本次整理的处理建议</h2><div class="example">${E(x.action)}</div></section><section><h2>需要谁参与确认</h2><p style="font-size:13px;color:#748769">${E(x.owner)}</p></section>${x.official?`<section><h2>独立列示的官方校核</h2>${officialBox(x.official)}</section>`:''}<section><h2>受影响的功能</h2>${chips(x.related)}</section>`;
const caution=D.decisions.filter(c=>c.related.includes(x.id));const returnView=x.type==='功能'?'features':x.type==='术语'?'terms':'decisions';return `<div class="breadcrumb"><button data-view="overview">知识总览</button><span>/</span><button data-view="${returnView}">${x.type==='功能'?'功能说明':x.type==='术语'?'术语词典':'口径与待确认'}</button><span>/</span><button data-module="${x.module}">${E(byModule.get(x.module).title)}</button></div><div class="detail-layout"><article class="article"><div class="chip-row"><span class="pill gray">${E(x.module)} · ${E(x.type)}</span>${x.status?statusPill(x.status):''}${x.phase?`<span class="pill gray">${E(x.phase)}</span>`:''}</div><h1>${E(x.title)}</h1>${x.en?`<div class="eng">${E(x.en)}</div>`:''}<p class="lead">${E(x.summary)}</p>${body}<section><h2>来源依据</h2>${sourceRefs(x.sources)}</section><div class="sharebar"><button class="btn" data-copy="${x.id}">复制本条链接</button><button class="btn" data-print="1">打印本条</button><button class="text-link" data-view="${returnView}">返回目录 →</button></div></article><aside class="detail-aside"><section class="aside-box"><h3>${x.type==='术语'?'关联功能与术语':'与哪些知识相连'}</h3><div class="aside-links">${related.slice(0,12).map(r=>`<button data-item="${r.id}"><small>${E(r.type)} · ${E(r.module)}</small>${E(r.title)} ↗</button>`).join('')||'<p>暂无直接关联</p>'}</div><div class="detail-mini-graph"><span>功能说明 → 关联术语</span><span>能力关系 → 场景使用</span><span>口径边界 → 来源核对</span></div></section>${caution.length?`<section class="aside-box" style="background:#f9f4e7"><h3>相关口径与待确认</h3><div class="aside-links">${caution.map(c=>`<button data-item="${c.id}"><small>${E(c.status)}</small>${E(c.title)} ↗</button>`).join('')}</div></section>`:''}<section class="aside-box"><h3>继续看这个主题</h3><p>${E(byModule.get(x.module).desc)}</p><button class="text-link" style="margin-top:12px" data-module="${x.module}">浏览全部功能 →</button></section></aside></div>${foot()}`}
function graph(){const positions={G1:[440,65],G3:[705,165],G2:[705,355],GOV:[440,455],G5:[175,355],IAM:[175,165],G4:[380,255],G6:[565,255]},selected=state.graph;return head('知识关联','点击节点，看它与其他能力怎样互相依赖；再进入功能，继续查术语和原文。连线表示本次归纳的功能关系，不表示实施时间顺序。','CONNECTED KNOWLEDGE')+`<div class="graph-layout"><section class="graph-canvas"><svg viewBox="0 0 880 525" role="group" aria-label="八大能力主题关联图"><title>八大能力主题关联图</title>${D.relations.map(r=>{const a=positions[r.a],b=positions[r.b];return `<path class="graph-edge ${r.a===selected||r.b===selected?'connected':''}" d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}"/>`}).join('')}${D.modules.map(m=>{const p=positions[m.id];return `<g class="graph-node ${m.id===selected?'active':''}" data-graph="${m.id}" role="button" tabindex="0" aria-label="${E(m.title)}的知识关联" aria-pressed="${m.id===selected}" transform="translate(${p[0]-83},${p[1]-33})"><rect width="166" height="66" rx="10"/><text class="code" x="83" y="23" text-anchor="middle">${m.id}</text><text class="label" x="83" y="46" text-anchor="middle">${E(m.title)}</text></g>`}).join('')}</svg><div class="caption">深色节点：当前主题　·　绿色连线：相关能力　·　支持点击与键盘回车选择</div></section><aside><div class="eyebrow">SELECTED DOMAIN / ${selected}</div><h2>${E(byModule.get(selected).title)}</h2><p class="hint" style="margin:9px 0 15px">${E(byModule.get(selected).desc)}</p><button class="btn" data-module="${selected}">进入该主题功能 ↗</button><div class="graph-detail" style="margin-top:17px">${D.relations.filter(r=>r.a===selected||r.b===selected).map(r=>{const other=r.a===selected?r.b:r.a;return `<button class="relation-entry" data-graph="${other}"><small style="color:#98a884">${r.a} ↔ ${r.b}</small><h4>${E(r.label)}</h4><p>${E(r.detail)}</p></button>`}).join('')}</div></aside></div><div class="section-head"><h2>沿一个主题继续阅读</h2><span class="hint">“依赖”与“受影响”均可回查</span></div><div class="card-grid">${D.features.filter(f=>f.module===selected).slice(0,6).map(card).join('')}</div>${foot()}`}
function scenarios(){return head('场景串讲','把术语放回合同办理链路；逐步查看每个动作依赖的功能，以及需要谁确认。示例用于学习，不替代客户最终业务流程。','SCENARIO PLAYBOOK')+`<div class="scenario-grid">${D.scenarios.map(s=>`<button class="scenario-card" data-scenario="${s.id}"><div class="eyebrow">${s.id} · ${s.steps.length} STEPS</div><h3>${E(s.title)}</h3><p>${E(s.summary)}</p><div class="mini-steps">${s.steps.map((v,i)=>`<span>${i+1} ${E(v[0])}</span>`).join('')}</div></button>`).join('')}</div>${foot()}`}
function scenario(id){const s=D.scenarios.find(x=>x.id===id);if(!s)return scenarios();return `<div class="breadcrumb"><button data-view="scenarios">场景串讲</button><span>/</span>${E(s.id)}</div><div class="detail-layout"><article class="article"><div class="eyebrow">SCENARIO / ${s.id}</div><h1>${E(s.title)}</h1><p class="lead">${E(s.summary)}</p><div class="timeline">${s.steps.map((v,i)=>`<div class="timeline-row"><div class="timeline-num">${i+1}</div><div class="timeline-content"><h3>${E(v[0])}</h3><p>${E(v[1])}</p>${chips(v[2].split('|'))}</div></div>`).join('')}</div><section><h2>来源依据</h2>${sourceRefs(s.sources)}</section></article><aside class="detail-aside"><section class="aside-box"><h3>这个场景要追问什么</h3><p style="font-size:12px;line-height:1.9">${E(s.questions)}</p></section><section class="aside-box"><h3>学习方法</h3><p>先看业务动作 → 点击功能 → 补齐术语 → 核对原文与范围。</p><button class="text-link" style="margin-top:15px" data-view="graph">查看能力关联 →</button></section></aside></div>${foot()}`}
function decisionPage(){const filtered=D.decisions.filter(x=>(state.module==='all'||x.module===state.module)&&match(x));return head('口径与待确认','不同研究版本的范围、假设和未决问题分别保留。“官方校核”是本次单独补充，不改写源文件；未给出客户答复的事项均保持未确认。','SCOPE & OPEN QUESTIONS')+`<div class="note">源文的“建议”“已修正 PPT”“规划基线”和“待填写”不代表产品已上线、客户已批准或法律结论已定。本页帮助识别需要进一步核实的事项。</div><div class="toolbar">${moduleSelect()}<button class="text-link" data-reset="1">重置筛选</button></div><div class="results-meta"><span>${filtered.length} 项口径记录</span><span>点击标题查看来源与受影响功能</span></div><div class="decision-list">${filtered.map(x=>`<article class="decision-card"><div style="display:flex;justify-content:space-between;gap:12px"><small style="color:#95a184">${x.id} · ${x.module}</small>${statusPill(x.status)}</div><h3><button class="text-link" style="font-size:16px;color:#39573c;padding:0" data-item="${x.id}">${E(x.title)} ↗</button></h3><p>${E(x.summary)}</p><div class="action"><b>处理建议：</b>${E(x.action)}</div><div class="bottom"><span>参与确认：${E(x.owner)}</span><button class="text-link" data-item="${x.id}">依据与关联 →</button></div></article>`).join('')}</div>${foot()}`}
function sources(){return head('来源与研究范围','纳入 13 份非大纲 Markdown 的研究归纳。公开版保留来源文件名、引用行号与内容指纹，原始研究资料由本地版保存。','SOURCE REGISTER')+`<div class="two-col"><section class="surface"><h3>本次实际研究</h3><p class="hint">共 ${D.sources.length} 份非大纲 Markdown，覆盖缺口、素材、专项方案、对标、综合说明、审计与全球化修订记录。</p><p class="subtle" style="margin-top:12px">研究范围：${E(D.sourceBase)}</p></section><section class="surface"><h3>没有纳入或未实时核验</h3><p class="hint">排除 12 份文件名含“大纲”的 Markdown；未研究 PPTX、DOCX、图片及 HTML。未跟随文内引用扩展读取目录外材料或飞书链接。</p></section></div><div class="note" style="margin-top:18px">正文功能来自这 13 份材料的归纳。综合说明本身引用了大纲，本次仅采用其已写入非大纲文档的内容，没有另读被排除的大纲；来源中的占位引用如 <code>[[cite:src-...]]</code> 保留为历史标记，不当作本次已访问的网页证据。</div><div class="section-head"><h2>本地研究来源</h2><span class="hint">点击文件，在页面内查看来源信息</span></div><div class="table-wrap"><table><thead><tr><th>编号</th><th>文档</th><th>文内日期</th><th>范围</th><th>来源</th></tr></thead><tbody>${D.sources.map(s=>`<tr><td class="subtle">${s.id}</td><td><button class="table-file" data-source="${s.id}" data-start="1" data-end="1">${E(s.name)}</button><div class="subtle">SHA-256 ${s.sha256.slice(0,16)}…</div></td><td class="subtle">${s.date}</td><td class="subtle">${s.topics.join(' · ')}</td><td><button class="text-link" data-source="${s.id}" data-start="1" data-end="1">${s.lines} 行 ↗</button></td></tr>`).join('')}</tbody></table></div><div class="section-head"><h2>少量官方校核，独立列示</h2><span class="hint">校核日期 ${D.date}</span></div><p class="hint" style="margin-bottom:15px">仅针对跨境判断、签名等级、删除例外、OIDC 与令牌流程纠正易混概念。未对各国法律、厂商区域、价格及法规时间表作全面实时复核。</p><div style="display:grid;gap:10px">${D.official.map(w=>officialBox(w.id)).join('')}</div><details class="surface" style="margin-top:24px"><summary style="cursor:pointer;font-size:13px">查看已排除的 12 份大纲文件</summary><ul class="hint" style="margin-top:15px;padding-left:20px">${D.excluded.map(p=>`<li>${E(p.split(/[\\/]/).pop())}</li>`).join('')}</ul></details><div class="section-head"><h2>版本与证据使用原则</h2></div><div class="surface"><div class="quick-list">${[['不把发布说明缺项当成产品缺失','C01'],['不把研究方案当作研发和合同承诺','C15'],['不把规划国家和语种当成支持清单','C07'],['不直接沿用不同版本的待确认总数','C17']].map(a=>`<button data-item="${a[1]}"><span>${a[0]}</span><span>↗</span></button>`).join('')}</div></div>${foot()}`}
function render(){const navView=state.view==='item'?(byId.get(state.id)?.type==='术语'?'terms':byId.get(state.id)?.type==='口径'?'decisions':'features'):state.view==='scenario'?'scenarios':state.view;$('nav').innerHTML=views.map(v=>`<button data-view="${v[0]}" class="${navView===v[0]?'active':''}" ${navView===v[0]?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${v[1]}</span><span>${v[2]}</span>${v[3]?`<span class="num">${v[3]}</span>`:''}</button>`).join('');$('module-nav').innerHTML=D.modules.map(m=>`<button data-module="${m.id}"><span class="module-code">${m.id}</span><span>${E(m.title)}</span></button>`).join('');$('search').value=state.q;$('clear-search').hidden=!state.q;let html=state.view==='overview'?overview():['features','terms','search'].includes(state.view)?browse(state.view):state.view==='item'?article(state.id):state.view==='graph'?graph():state.view==='scenarios'?scenarios():state.view==='scenario'?scenario(state.id):state.view==='decisions'?decisionPage():sources();$('content').innerHTML=html;document.title=(state.view==='item'?byId.get(state.id)?.title:views.find(v=>v[0]===state.view)?.[2]||'搜索结果')+' · 产品国际化知识库'}
function saveHash(replace=false){let h=state.view==='item'?'item/'+state.id:state.view==='scenario'?'scenario/'+state.id:state.view==='search'?'search/'+encodeURIComponent(state.q):state.view+(state.module!=='all'?'/'+state.module:'');(replace?history.replaceState:history.pushState).call(history,null,'','#'+h)}
function navigate(view,module='all',id=null){state={...state,view,module,id,q:'',kind:'all',status:'all'};closeNav();saveHash();render();window.scrollTo(0,0);$('content').focus({preventScroll:true})}
function readHash(){let [v,...rest]=location.hash.slice(1).split('/');if(!v)v='overview';if(v==='item'&&byId.has(rest[0]))state={...state,view:'item',id:rest[0],q:'',module:'all',status:'all'};else if(v==='scenario'&&D.scenarios.some(s=>s.id===rest[0]))state={...state,view:'scenario',id:rest[0],q:'',module:'all'};else if(v==='search'){let q;try{q=decodeURIComponent(rest.join('/'))}catch{q=rest.join('/')}state={...state,view:'search',q,module:'all',status:'all',kind:'all'}}else if(views.some(x=>x[0]===v))state={...state,view:v,q:'',module:byModule.has(rest[0])?rest[0]:'all',status:'all'};else state={...state,view:'overview',q:'',module:'all'};render()}
function closeNav(){$('sidebar').classList.remove('open');$('navshade').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function openSource(id,start,end){
 const s=bySource.get(id);if(!s)return;lastFocus=document.activeElement;sourceState=null;
 $('source-title').textContent=id+' · '+s.name;
 $('source-path').textContent='研究资料来源索引 · 文内日期 '+s.date;
 document.querySelector('.source-tools').style.display='none';
 $('source-code').innerHTML=`<div style="padding:24px;max-width:850px"><div class="eyebrow">SOURCE REFERENCE / ${id}</div><h2 style="font-size:19px;line-height:1.8;margin-bottom:18px">${E(s.name)}</h2><div class="example" style="margin-bottom:18px">引用位置：<b>L${start}${end!==start?'–'+end:''}</b> · 文档共 ${s.lines} 行</div><p style="font-size:13px;line-height:2;color:#748769">公开版保留提炼内容、来源文件名、引用行号和内容指纹。原始研究材料全文未随公开网页发布；需要逐行核对时，请使用本地完整版知识库。</p><div style="margin-top:25px;font-size:11px;color:#869578;overflow-wrap:anywhere">文内日期：${E(s.date)}<br>SHA-256：${E(s.sha256)}<br>涉及主题：${E(s.topics.join(' · '))}</div></div>`;
 $('source-modal').hidden=false;document.body.style.overflow='hidden';$('source-code').scrollTop=0;$('source-close').focus();
}
function closeSource(){$('source-modal').hidden=true;document.body.style.overflow='';sourceState=null;if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
function findSource(){if(!sourceState)return;const q=$('source-find').value.toLocaleLowerCase();sourceState.matches=[];sourceState.index=-1;$('source-code').querySelectorAll('.source-line').forEach((e,i)=>{e.classList.remove('match','current');if(q&&sourceState.s.text.split(/\r?\n/)[i]?.toLocaleLowerCase().includes(q)){e.classList.add('match');sourceState.matches.push(e)}});if(sourceState.matches.length)moveMatch(1);else $('match-count').textContent=q?'0 个匹配':''}
function moveMatch(dir){if(!sourceState||!sourceState.matches.length)return;const a=sourceState;for(const el of a.matches)el.classList.remove('current');a.index=(a.index+dir+a.matches.length)%a.matches.length;const el=a.matches[a.index];el.classList.add('current');$('source-code').scrollTop=el.offsetTop-$('source-code').offsetTop-55;$('match-count').textContent=(a.index+1)+' / '+a.matches.length}
async function copyLink(id){const url=location.href.split('#')[0]+'#item/'+id;try{await navigator.clipboard.writeText(url);toast('已复制本条知识链接')}catch{const el=document.createElement('textarea');el.value=url;el.style.position='fixed';el.style.left='-9999px';document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();toast(ok?'已复制本条知识链接':'可复制浏览器地址栏中的本条链接')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-view],[data-module],[data-item],[data-kind],[data-source],[data-reset],[data-graph],[data-scenario],[data-copy],[data-print]');if(!el)return;if(el.dataset.view)navigate(el.dataset.view);else if(el.dataset.module)navigate('features',el.dataset.module);else if(el.dataset.item)navigate('item','all',el.dataset.item);else if(el.dataset.kind){state.kind=el.dataset.kind;render()}else if(el.dataset.source)openSource(el.dataset.source,+el.dataset.start||1,+el.dataset.end||1);else if(el.dataset.reset){state={...state,q:'',module:'all',kind:'all',status:'all'};saveHash(true);render()}else if(el.dataset.graph){state.graph=el.dataset.graph;render()}else if(el.dataset.scenario)navigate('scenario','all',el.dataset.scenario);else if(el.dataset.copy)copyLink(el.dataset.copy);else if(el.dataset.print)window.print()});
document.addEventListener('change',e=>{if(e.target.id==='module-filter'){state.module=e.target.value;saveHash(true);render()}if(e.target.id==='status-filter'){state.status=e.target.value;render()}});
$('search').addEventListener('input',e=>{state.q=e.target.value;state.view='search';state.module='all';state.kind='all';state.status='all';saveHash(true);render()});$('clear-search').addEventListener('click',()=>{state.q='';saveHash(true);render();$('search').focus()});$('menu').addEventListener('click',()=>{const open=!$('sidebar').classList.contains('open');$('sidebar').classList.toggle('open',open);$('navshade').classList.toggle('open',open);$('menu').setAttribute('aria-expanded',String(open))});$('navshade').addEventListener('click',closeNav);$('source-close').addEventListener('click',closeSource);$('source-modal').addEventListener('click',e=>{if(e.target===$('source-modal'))closeSource()});$('source-find').addEventListener('input',findSource);$('source-prev').addEventListener('click',()=>moveMatch(-1));$('source-next').addEventListener('click',()=>moveMatch(1));$('source-find').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();moveMatch(e.shiftKey?-1:1)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('source-modal').hidden)closeSource();else closeNav()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('source-modal').hidden)$('search').focus();else $('source-find').focus()}if(e.target.matches('.graph-node')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();state.graph=e.target.dataset.graph;render();document.querySelector(`[data-graph="${state.graph}"].graph-node`)?.focus()}if(e.key==='Tab'&&!$('source-modal').hidden){const focusable=[...$('source-modal').querySelectorAll('button,input')].filter(el=>el.getClientRects().length>0);const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('popstate',()=>{readHash();window.scrollTo(0,0)});readHash();
</script>
</body></html>
